<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Devin Automation — Live Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-0: #0a0a0b; --bg-1: #111113; --bg-2: #18181b; --bg-3: #1e1e22;
      --border: #27272a; --border-subtle: #1f1f23;
      --text-primary: #fafafa; --text-secondary: #a1a1aa; --text-muted: #71717a;
      --accent: #3b82f6; --accent-dim: rgba(59,130,246,.12);
      --green: #22c55e; --green-dim: rgba(34,197,94,.12);
      --red: #ef4444; --red-dim: rgba(239,68,68,.12);
      --amber: #f59e0b; --amber-dim: rgba(245,158,11,.12);
      --purple: #a855f7; --purple-dim: rgba(168,85,247,.12);
      --cyan: #06b6d4; --cyan-dim: rgba(6,182,212,.12);
      --radius: 8px; --radius-lg: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
      --shadow-lg: 0 4px 12px rgba(0,0,0,.5);
    }
    html { font-size: 14px; }
    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--bg-0); color: var(--text-primary);
      line-height: 1.5; min-height: 100vh;
      background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,130,246,.08), transparent);
    }

    /* ── Header ───────────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; gap: 16px;
      background: rgba(10,10,11,.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo-mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: grid; place-items: center;
    }
    .logo-mark svg { width: 18px; height: 18px; fill: #fff; }
    .header-title { font-size: 16px; font-weight: 600; letter-spacing: -.02em; }
    .header-subtitle { font-size: 12px; color: var(--text-muted); }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .health-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-secondary);
      padding: 4px 10px; border-radius: 20px;
      background: var(--bg-2); border: 1px solid var(--border);
    }
    .health-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-muted); transition: background .3s;
    }
    .health-dot.ok { background: var(--green); box-shadow: 0 0 6px rgba(34,197,94,.5); }
    .health-dot.err { background: var(--red); }
    .btn-trigger {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; font-size: 13px; font-weight: 500;
      color: #fff; background: var(--accent);
      border: none; border-radius: var(--radius); cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .btn-trigger:hover { background: #2563eb; }
    .btn-trigger:active { transform: scale(.97); }
    .btn-trigger svg { width: 14px; height: 14px; fill: currentColor; }
    .last-refresh { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

    /* ── Main container ───────────────────────────────────────── */
    main { max-width: 1440px; margin: 0 auto; padding: 24px 32px 64px; }

    /* ── Metrics cards ────────────────────────────────────────── */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px; margin-bottom: 32px;
    }
    .metric-card {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px 18px;
      position: relative; overflow: hidden; transition: border-color .2s;
    }
    .metric-card:hover { border-color: var(--accent); }
    .metric-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0; transition: opacity .3s;
    }
    .metric-card:hover::before { opacity: 1; }
    .metric-label {
      font-size: 11px; font-weight: 500; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-muted); margin-bottom: 8px;
    }
    .metric-value {
      font-size: 28px; font-weight: 700; letter-spacing: -.03em;
      font-variant-numeric: tabular-nums;
      transition: color .3s;
    }
    .metric-value.accent { color: var(--accent); }
    .metric-value.green { color: var(--green); }
    .metric-value.red { color: var(--red); }
    .metric-value.amber { color: var(--amber); }
    /* animated counter flash */
    @keyframes flash { 0% { opacity: .5; } 100% { opacity: 1; } }
    .metric-value.changed { animation: flash .4s ease-out; }

    /* ── Two-column layout ────────────────────────────────────── */
    .columns {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 24px; align-items: start;
    }
    @media (max-width: 960px) { .columns { grid-template-columns: 1fr; } }

    /* ── Section panel ────────────────────────────────────────── */
    .panel {
      background: var(--bg-1); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
    }
    .panel-title {
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .04em; color: var(--text-secondary);
    }
    .panel-count {
      font-size: 11px; color: var(--text-muted);
      background: var(--bg-3); padding: 2px 8px; border-radius: 10px;
    }
    .panel-body { padding: 8px; max-height: 72vh; overflow-y: auto; }
    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Task card ─────────────────────────────────────────────── */
    .task-card {
      background: var(--bg-2); border: 1px solid var(--border-subtle);
      border-radius: var(--radius); padding: 14px 16px;
      margin-bottom: 6px; transition: border-color .2s, background .2s;
    }
    .task-card:hover { border-color: var(--border); background: var(--bg-3); }
    .task-card:last-child { margin-bottom: 0; }
    .task-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .role-badge {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; padding: 2px 8px; border-radius: 4px;
    }
    .role-badge.orchestrator { background: var(--cyan-dim); color: var(--cyan); }
    .role-badge.worker { background: var(--purple-dim); color: var(--purple); }
    .status-pill {
      font-size: 11px; font-weight: 500; padding: 2px 10px;
      border-radius: 20px; display: inline-flex; align-items: center; gap: 5px;
    }
    .status-pill::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
    }
    .status-pill.running { background: var(--accent-dim); color: var(--accent); }
    .status-pill.running::before { background: var(--accent); }
    .status-pill.awaiting_ci { background: var(--amber-dim); color: var(--amber); }
    .status-pill.awaiting_ci::before { background: var(--amber); }
    .status-pill.blocked { background: var(--purple-dim); color: var(--purple); }
    .status-pill.blocked::before { background: var(--purple); }
    .status-pill.completed { background: var(--green-dim); color: var(--green); }
    .status-pill.completed::before { background: var(--green); }
    .status-pill.failed { background: var(--red-dim); color: var(--red); }
    .status-pill.failed::before { background: var(--red); }
    .status-pill.queued { background: rgba(113,113,122,.12); color: var(--text-muted); }
    .status-pill.queued::before { background: var(--text-muted); }
    .task-issue { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-issue a { color: var(--text-primary); }
    .task-issue a:hover { color: var(--accent); }
    .task-meta {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      font-size: 12px; color: var(--text-muted);
    }
    .task-meta-item { display: inline-flex; align-items: center; gap: 4px; }
    .task-meta-item svg { width: 12px; height: 12px; fill: currentColor; opacity: .6; }
    .task-meta a { color: var(--accent); font-weight: 500; }
    .task-meta a:hover { text-decoration: underline; }
    .btn-session {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; font-size: 11px; font-weight: 500;
      color: var(--accent); background: var(--accent-dim);
      border: 1px solid rgba(59,130,246,.2); border-radius: 6px;
      text-decoration: none; transition: background .2s;
    }
    .btn-session:hover { background: rgba(59,130,246,.2); text-decoration: none; }

    /* ── Timeline ──────────────────────────────────────────────── */
    .timeline { padding: 12px 16px; }
    .tl-item {
      display: flex; gap: 12px; padding-bottom: 16px;
      position: relative;
    }
    .tl-item:last-child { padding-bottom: 0; }
    .tl-track {
      display: flex; flex-direction: column; align-items: center;
      width: 20px; flex-shrink: 0;
    }
    .tl-dot {
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid var(--border); background: var(--bg-0);
      flex-shrink: 0; z-index: 1;
    }
    .tl-line { flex: 1; width: 2px; background: var(--border); margin-top: 4px; }
    .tl-item:last-child .tl-line { display: none; }
    .tl-dot.running { border-color: var(--accent); background: var(--accent); }
    .tl-dot.awaiting_ci { border-color: var(--amber); background: var(--amber); }
    .tl-dot.blocked { border-color: var(--purple); background: var(--purple); }
    .tl-dot.completed { border-color: var(--green); background: var(--green); }
    .tl-dot.failed { border-color: var(--red); background: var(--red); }
    .tl-dot.queued { border-color: var(--text-muted); }
    .tl-content { flex: 1; min-width: 0; }
    .tl-title {
      font-size: 12px; font-weight: 500; color: var(--text-primary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tl-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ── Empty state ───────────────────────────────────────────── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 64px 32px; text-align: center;
    }
    .empty-state svg { width: 120px; height: 120px; margin-bottom: 24px; opacity: .3; }
    .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary); }
    .empty-state p { font-size: 13px; color: var(--text-muted); max-width: 320px; }

    /* ── Pulse for running dot ─────────────────────────────────── */
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .status-pill.running::before { animation: pulse 2s ease-in-out infinite; }
    .tl-dot.running { animation: pulse 2s ease-in-out infinite; }

    /* ── Responsive ────────────────────────────────────────────── */
    @media (max-width: 768px) {
      header { padding: 12px 16px; }
      main { padding: 16px; }
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->
<header>
  <div class="header-left">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div>
      <div class="header-title">Devin Remediation Pipeline</div>
      <div class="header-subtitle">Apache Superset — Live Observability</div>
    </div>
  </div>
  <div class="header-right">
    <div class="health-badge">
      <span class="health-dot" id="healthDot"></span>
      <span id="healthText">Checking…</span>
    </div>
    <span class="last-refresh" id="lastRefresh">—</span>
    <button class="btn-trigger" id="triggerBtn" onclick="triggerScan()">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4a8 8 0 108 8h-2a6 6 0 11-1.76-4.24l-2.12 2.12H20V4l-2.35 2.35z"/></svg>
      Trigger Scan
    </button>
  </div>
</header>

<!-- ═══════════ MAIN ═══════════ -->
<main>
  <!-- Metrics -->
  <div class="metrics-grid" id="metricsGrid"></div>

  <!-- Two columns -->
  <div class="columns">
    <!-- LEFT: Tasks -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Tasks</span>
        <span class="panel-count" id="taskCount">0</span>
      </div>
      <div class="panel-body" id="taskList"></div>
    </div>

    <!-- RIGHT: Timeline -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Pipeline Activity</span>
        <span class="panel-count" id="tlCount">0 events</span>
      </div>
      <div class="panel-body" id="timelineList"></div>
    </div>
  </div>
</main>

<script>
/* ================================================================
   State
   ================================================================ */
let prevMetrics = {};
let prevTaskMap = {};

/* ================================================================
   Helpers
   ================================================================ */
function esc(s) {
  if (!s) return '';
  return s.replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":"&#39;"}[c]));
}

function fmtDuration(sec) {
  if (!sec || sec < 0) return '0s';
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ' + (sec % 60) + 's';
  return Math.floor(sec / 3600) + 'h ' + Math.floor((sec % 3600) / 60) + 'm';
}

function timeAgo(iso) {
  if (!iso) return '';
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function statusLabel(s) {
  const map = { running:'Running', awaiting_ci:'Awaiting CI', blocked:'Blocked',
                completed:'Completed', failed:'Failed', queued:'Queued' };
  return map[s] || s;
}

/* ================================================================
   Health check
   ================================================================ */
async function checkHealth() {
  const dot = document.getElementById('healthDot');
  const txt = document.getElementById('healthText');
  try {
    const r = await fetch('/healthz');
    const d = await r.json();
    if (d.status === 'ok') {
      dot.className = 'health-dot ok';
      txt.textContent = 'Healthy';
    } else { throw 0; }
  } catch {
    dot.className = 'health-dot err';
    txt.textContent = 'Unhealthy';
  }
}

/* ================================================================
   Trigger scan
   ================================================================ */
async function triggerScan() {
  const btn = document.getElementById('triggerBtn');
  btn.disabled = true;
  btn.textContent = 'Starting…';
  try {
    await fetch('/trigger/scan', { method: 'POST' });
    btn.textContent = 'Triggered!';
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4a8 8 0 108 8h-2a6 6 0 11-1.76-4.24l-2.12 2.12H20V4l-2.35 2.35z"/></svg> Trigger Scan';
    }, 2000);
  } catch {
    btn.textContent = 'Error';
    btn.disabled = false;
  }
}

/* ================================================================
   Metrics
   ================================================================ */
function renderMetrics(m) {
  const items = [
    { key:'workers_total',    label:'Workers Total', value: m.workers_total,  cls:'' },
    { key:'workers_running',  label:'Running',       value: m.workers_running, cls:'accent' },
    { key:'workers_completed',label:'Completed',     value: m.workers_completed, cls:'green' },
    { key:'workers_failed',   label:'Failed',        value: m.workers_failed,  cls:'red' },
    { key:'prs_opened',       label:'PRs Opened',    value: m.prs_opened,     cls:'' },
    { key:'success_rate_pct', label:'Success %',     value: m.success_rate_pct + '%', cls:'green' },
    { key:'avg_duration_seconds', label:'Avg Duration', value: fmtDuration(m.avg_duration_seconds), cls:'' },
    { key:'ci_retries_total', label:'CI Retries',    value: m.ci_retries_total, cls:'amber' },
  ];
  const grid = document.getElementById('metricsGrid');
  grid.innerHTML = items.map(item => {
    const changed = prevMetrics[item.key] !== undefined && String(prevMetrics[item.key]) !== String(item.key === 'success_rate_pct' ? m[item.key] + '%' : (item.key === 'avg_duration_seconds' ? fmtDuration(m[item.key]) : m[item.key]));
    return `<div class="metric-card">
      <div class="metric-label">${item.label}</div>
      <div class="metric-value ${item.cls}${changed ? ' changed' : ''}">${item.value}</div>
    </div>`;
  }).join('');
  // Store raw values for change detection
  items.forEach(i => { prevMetrics[i.key] = i.value; });
}

/* ================================================================
   Tasks
   ================================================================ */
function renderTasks(tasks) {
  const el = document.getElementById('taskList');
  const countEl = document.getElementById('taskCount');
  countEl.textContent = tasks.length;

  if (!tasks.length) {
    el.innerHTML = emptyStateHTML();
    return;
  }

  el.innerHTML = tasks.map(t => {
    const roleCls = t.role === 'orchestrator' ? 'orchestrator' : 'worker';
    const issueLink = t.issue_number
      ? `<a href="${esc(t.issue_url)}" target="_blank" rel="noopener">#${t.issue_number}</a> ${esc(t.issue_title || '')}`
      : '<em style="color:var(--text-muted)">Orchestrator</em>';
    const prLink = t.pr_url
      ? `<a href="${esc(t.pr_url)}" target="_blank" rel="noopener">PR #${t.pr_number}</a>`
      : '—';
    const sessionBtn = t.session_url
      ? `<a class="btn-session" href="${esc(t.session_url)}" target="_blank" rel="noopener">
           <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
           View Session
         </a>`
      : '';
    return `<div class="task-card">
      <div class="task-top">
        <span class="role-badge ${roleCls}">${t.role}</span>
        <span class="status-pill ${t.status}">${statusLabel(t.status)}</span>
        <span class="task-issue">${issueLink}</span>
      </div>
      <div class="task-meta">
        <span class="task-meta-item">
          <svg viewBox="0 0 24 24"><path d="M6 2v6h.01L6 8.01 10 12l-4 4 .01.01H6V22h12v-5.99h-.01L18 16l-4-4 4-3.99-.01-.01H18V2H6z"/></svg>
          ${fmtDuration(t.duration_seconds)}
        </span>
        <span class="task-meta-item">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
          ${prLink}
        </span>
        ${t.ci_retries > 0 ? `<span class="task-meta-item" style="color:var(--amber)">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4a8 8 0 108 8h-2a6 6 0 11-1.76-4.24l-2.12 2.12H20V4l-2.35 2.35z"/></svg>
          ${t.ci_retries} ${t.ci_retries === 1 ? 'retry' : 'retries'}
        </span>` : ''}
        ${sessionBtn}
      </div>
    </div>`;
  }).join('');
}

/* ================================================================
   Timeline (derived from task data)
   ================================================================ */
function renderTimeline(tasks) {
  const el = document.getElementById('timelineList');
  const countEl = document.getElementById('tlCount');

  // Build events from tasks
  const events = [];
  tasks.forEach(t => {
    const label = t.role === 'orchestrator'
      ? 'Orchestrator'
      : (t.issue_number ? `#${t.issue_number}` : 'Worker');
    const title = t.issue_title ? esc(t.issue_title) : '';

    events.push({
      status: t.status,
      title: `${label} → ${statusLabel(t.status)}`,
      sub: title || t.session_id.slice(0, 12),
      time: t.completed_at || t.created_at,
      sortKey: new Date(t.completed_at || t.created_at).getTime(),
    });

    // If there's a PR, add a PR event
    if (t.pr_url) {
      events.push({
        status: 'running',
        title: `${label} opened PR #${t.pr_number}`,
        sub: title || '',
        time: t.created_at,
        sortKey: new Date(t.created_at).getTime() + 1,
      });
    }

    // CI retries
    if (t.ci_retries > 0) {
      events.push({
        status: 'awaiting_ci',
        title: `${label} — CI retry #${t.ci_retries}`,
        sub: 'Self-correcting',
        time: t.created_at,
        sortKey: new Date(t.created_at).getTime() + 2,
      });
    }
  });

  events.sort((a, b) => b.sortKey - a.sortKey);
  countEl.textContent = events.length + ' events';

  if (!events.length) {
    el.innerHTML = `<div class="empty-state" style="padding:40px 20px">
      <p style="color:var(--text-muted)">No pipeline activity yet</p>
    </div>`;
    return;
  }

  el.innerHTML = `<div class="timeline">${events.map(ev => `
    <div class="tl-item">
      <div class="tl-track">
        <div class="tl-dot ${ev.status}"></div>
        <div class="tl-line"></div>
      </div>
      <div class="tl-content">
        <div class="tl-title">${ev.title}</div>
        <div class="tl-sub">${ev.sub} · ${timeAgo(ev.time)}</div>
      </div>
    </div>`).join('')}
  </div>`;
}

/* ================================================================
   Empty state
   ================================================================ */
function emptyStateHTML() {
  return `<div class="empty-state">
    <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="20" y="30" width="80" height="60" rx="8" stroke="#3b82f6" stroke-width="2" opacity=".3"/>
      <circle cx="60" cy="55" r="14" stroke="#3b82f6" stroke-width="2" opacity=".4"/>
      <path d="M56 55l3 3 6-6" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
      <path d="M40 100h40" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>
      <circle cx="60" cy="20" r="4" fill="#3b82f6" opacity=".2"/>
      <circle cx="30" cy="50" r="2" fill="#3b82f6" opacity=".15"/>
      <circle cx="90" cy="45" r="3" fill="#3b82f6" opacity=".15"/>
      <path d="M10 75c10-5 20 5 30 0s20-10 30-5 20 8 30 3" stroke="#27272a" stroke-width="1" opacity=".3"/>
    </svg>
    <h3>No tasks running</h3>
    <p>Click <strong>Trigger Scan</strong> to start the remediation pipeline. Tasks will appear here in real time.</p>
  </div>`;
}

/* ================================================================
   Polling loop
   ================================================================ */
async function refresh() {
  try {
    const [metricsRes, tasksRes] = await Promise.all([
      fetch('/api/metrics'),
      fetch('/api/tasks'),
    ]);
    const metrics = await metricsRes.json();
    const tasks = await tasksRes.json();

    renderMetrics(metrics);
    renderTasks(tasks);
    renderTimeline(tasks);

    document.getElementById('lastRefresh').textContent =
      'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    console.error('Refresh failed:', e);
    // Show empty state on fetch failure (e.g. server not running)
    renderTasks([]);
    renderTimeline([]);
    renderMetrics({
      workers_total: 0, workers_running: 0, workers_completed: 0,
      workers_failed: 0, prs_opened: 0, success_rate_pct: 0,
      avg_duration_seconds: 0, ci_retries_total: 0,
    });
  }
}

// Init — show empty state immediately, then start polling
renderTasks([]);
renderTimeline([]);
checkHealth();
refresh();
setInterval(refresh, 3000);
setInterval(checkHealth, 15000);
</script>
</body>
</html>
